<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Bingo – Sounds</title>
    <meta name="description" content="Tap a bird card to hear its call. Sibley Backyard Birding Bingo – interactive sounds edition." />
    <!-- Installed standalone, iOS tints the status-bar band with theme-color.
         This app follows the system scheme, so a single dark value would put a
         near-black band over a near-white page in light mode. -->
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <!-- Installed-app chrome. Deliberately NOT `black-translucent` +
         `viewport-fit=cover` like the sibling apps: that combination paints
         under the Dynamic Island, and every fixed edge then has to buy the
         safe areas back by hand — the home button, the scroll-top button, the
         alphabet rail and its bubble. It also walks into the WebKit bug adhdo
         hit, where a page whose <html> is `height: 100%` gets an initial
         containing block a status-bar shorter than the screen. Letting iOS
         inset the web view costs the bleed under the clock and buys a viewport
         that cannot be wrong. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Home-screen icons. Generated by `node scripts/make-icons.mjs` — edit the
         script, never the PNGs. The short title keeps iOS from labelling the
         tile "Bird Bingo – Sou…" the way it does with the full <title>. -->
    <meta name="apple-mobile-web-app-title" content="Bird Bingo" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
